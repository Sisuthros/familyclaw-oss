[package]
name = "familyclaw-acp"
description = "ACP (Agent Communication Protocol) client — spawn and control CLI agents (Claude, Gemini, Qoder) over stdio"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["agent", "acp", "cli", "protocol", "stdio"]
categories = ["command-line-interface", "asynchronous"]

[lints]
workspace = true

[dependencies]
familyclaw-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
