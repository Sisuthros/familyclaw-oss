[package]
name = "familyclaw-durable"
description = "Durable execution substrate providing deterministic, crash-proof replay of agent workflows with at-most-once side-effect dispatch"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["durable-execution", "replay", "workflow", "crash-recovery", "agent"]
categories = ["asynchronous", "development-tools"]

[lints]
workspace = true

[dependencies]
familyclaw-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
