[package]
name = "familyclaw-memory"
description = "Persistent agent memory store with Ebbinghaus-style decay, VAD emotional tagging, and permanent identity anchors"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["agent", "memory", "persistence", "vector-search", "runtime"]
categories = ["data-structures", "asynchronous"]

[lints]
workspace = true

[features]
# Vektoritason laajennus (Phase 3b). Oletuksena pois → oletuskäännös on
# tavu-identtinen tämän kanssa ja ilman. Phase 3b (familyclaw-lancevec)
# laajentaa tätä: lance = ["dep:familyclaw-lancevec", "vector-store"].
vector-store = []

[dependencies]
familyclaw-core = { workspace = true }
familyclaw-embeddings = { workspace = true }
familyclaw-emotion = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
# `fs` lisätään workspace-pohjaan: LocalJsonStore persistoi JSON-tiedostoon
# epälohkaisevasti (tokio::fs). Muut featuret tulevat workspace-määrittelystä.
tokio = { workspace = true, features = ["fs"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
