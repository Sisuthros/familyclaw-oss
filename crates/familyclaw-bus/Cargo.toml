[package]
name = "familyclaw-bus"
description = "Actor-based message bus for multi-agent systems, built on Ractor, with shared emotional-state propagation between agents"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["actor", "agent", "message-bus", "async", "runtime"]
categories = ["asynchronous", "concurrency"]

[lints]
workspace = true

[dependencies]
familyclaw-core = { workspace = true }
familyclaw-emotion = { workspace = true }
familyclaw-latent = { workspace = true }
ractor = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
