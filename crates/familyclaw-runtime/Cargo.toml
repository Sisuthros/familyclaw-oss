[package]
name = "familyclaw-runtime"
description = "Runtime assembly layer that wires the message bus, agents, channels, and reply pump into a single running system"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["agent", "runtime", "orchestration", "async"]
categories = ["asynchronous", "development-tools"]

[lints]
workspace = true

[features]
# Kytkee Wasmtime-sandboxin passthrough-piirteenä `familyclaw-sandbox/wasmtime`:aan.
# `FAMILYCLAW_SANDBOX_SKILLS=1` + tämä feature → agentti saa oikean hiekkalaatikon.
wasmtime = ["familyclaw-sandbox/wasmtime"]
# Kytkee OllamaEmbedderin (aito semanttinen recall) passthrough-piirteenä
# `familyclaw-embeddings/ollama`:aan. Oletuksena POIS: vetää reqwestin.
# resolve_embedder() valitsee sen ajossa FAMILYCLAW_EMBED_PROVIDER=ollama.
ollama = ["familyclaw-embeddings/ollama"]

[dependencies]
familyclaw-core = { workspace = true }
familyclaw-bus = { workspace = true }
# Siltakerroksen tapahtumaväylä (FamilyBridge/EventBus): valinnainen jaettu
# silta, jonka kautta ajonaikaiset virstanpylväät (esim. agentin rekisteröinti)
# julkaistaan havainnoitavuus-tallentimelle (gateway tilaa EventRecorderilla).
familyclaw-bridge = { workspace = true }
familyclaw-agent = { workspace = true }
# Toimintoajoympäristö (ActionRuntime): agentin tool-loop ajaa työkalukutsut
# tämän läpi, ja operaattorin hyväksyntäpinta (gateway /approvals) jakaa SAMAN
# Arc<Mutex<ActionRuntime>>-kahvan suspend/resume-siltaa varten.
familyclaw-actions = { workspace = true }
familyclaw-channels = { workspace = true }
familyclaw-embeddings = { workspace = true }
familyclaw-memory = { workspace = true }
familyclaw-durable = { workspace = true }
familyclaw-dream = { workspace = true }
familyclaw-scheduler = { workspace = true }
familyclaw-hearth = { workspace = true }
familyclaw-mcp = { workspace = true }
familyclaw-sandbox = { workspace = true }
ractor = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# DreamSkill (Phase 4): taito-trait (async-trait), payload/output (serde_json),
# vakaa skill-id (uuid), ajastinintervalli (chrono::Duration).
async-trait = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }
# Mock-LLM-palvelin (OpenAI-yhteensopiva) roundtrip-integraatiotestiin.
# Workspace-deppi (ei uutta ulkoista riippuvuutta) ja vain test-puolella.
axum = { workspace = true }
serde_json = { workspace = true }
familyclaw-channels = { workspace = true }
familyclaw-agent = { workspace = true }
familyclaw-core = { workspace = true }
# Lähetys-outboxin (DispatchOutboxStore) PRODUCT-PATH-kaatumiskestävyystesti:
# seed committed/intent-only -avain ja todista at-most-once build_family:n läpi.
familyclaw-actions = { workspace = true }
# Laskuri-skillin (sivuvaikutuksen mittari) rakentamiseen testissä.
async-trait = { workspace = true }
uuid = { workspace = true }
