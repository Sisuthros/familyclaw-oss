[package]
name = "familyclaw-agent"
description = "Agent runtime, session management, SOUL loading"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
familyclaw-core = { workspace = true }
familyclaw-bridge = { workspace = true }
familyclaw-bus = { workspace = true }
# Tool loop (Phase 1 keystone): agentti rakentaa LLM:lle tarjottavat
# ToolDefinitionit actionsin julkaisemista MCP-kuvauksista ja reitittää
# työkalukutsut takaisin tänne. Riippuvuus kulkee VAIN agent → actions
# (ei sykliä — actions ei riipu agentista).
familyclaw-actions = { workspace = true }
familyclaw-memory = { workspace = true }
familyclaw-emotion = { workspace = true }
familyclaw-durable = { workspace = true }
familyclaw-dream = { workspace = true }
familyclaw-channels = { workspace = true }
familyclaw-sandbox = { workspace = true }
ractor = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
# continuity_daemon-binäärin (familyclaw-bench black box) virhetyyppi.
thiserror = { workspace = true }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
uuid = { workspace = true }

# Demo-binääri: elävä siemen (design Vaihe 0).
[[bin]]
name = "familyclaw"
path = "src/bin/familyclaw.rs"

# Crash replay demo: demonstrates crash-proof memory.
[[bin]]
name = "crash_replay"
path = "src/bin/crash_replay.rs"

# Continuity daemon: black box driven by familyclaw-bench (crash/resume/recall/sleep).
[[bin]]
name = "continuity_daemon"
path = "src/bin/continuity_daemon.rs"
