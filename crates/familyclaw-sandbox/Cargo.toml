[package]
name = "familyclaw-sandbox"
description = "Isolated code execution sandbox for agent-generated code, backed by wasmtime with fuel limits and a deny-by-default capability model"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["wasm", "wasmtime", "sandbox", "security", "agent"]
categories = ["wasm", "development-tools"]

[lints]
workspace = true

[features]
# Oletuksena ei mitään: vain trait-rajapinta + NoopSandbox.
default = []
# Kytkee oikean wasmtime-pohjaisen sandbox-toteutuksen.
# wasmtime on iso riippuvuus (Cranelift + JIT), joten se on tarkoituksella
# optional ettei se hidasta koko workspacen buildia kun sandboxia ei tarvita.
wasmtime = ["dep:wasmtime"]

[dependencies]
familyclaw-core = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
# Optional — vain `wasmtime`-featuren takana.
wasmtime = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# serde_json — serde-roundtrip-testeihin (capability/fuel/output).
serde_json = { workspace = true }
# `wat` kääntää WAT-tekstin WASM-tavukoodiksi wasmtime-backendin testeissä.
# Vain testikäyttö; wasmtime-featuren testit tarvitsevat tämän.
wat = { workspace = true }
