[package]
name = "familyclaw-dream"
description = "Scheduled memory consolidation for agents, modeled on hippocampal replay: deduplicates, resolves conflicts, and cleans up stored memories"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["agent", "memory", "consolidation", "scheduler", "runtime"]
categories = ["asynchronous", "development-tools"]

[lints]
workspace = true

[dependencies]
familyclaw-core = { workspace = true }
familyclaw-memory = { workspace = true }
familyclaw-durable = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[[bin]]
name = "dream-cron-job"
path = "src/bin/dream-cron-job.rs"
