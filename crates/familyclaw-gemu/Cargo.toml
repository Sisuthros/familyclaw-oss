[package]
name = "familyclaw-gemu"
description = "Gemu CLI — Geminin rälläkkäliittymä FamilyClaw'n rasvamonttuun"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "gemu"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# API-letku
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# CLI
clap = { version = "4", features = ["derive"] }

# Tunnista kooditiedostoja
ignore = "0.4"

# Tokenien lasku context-managementtiin
tiktoken-rs = "0.6"

# Virheet
anyhow = { workspace = true }
thiserror = { workspace = true }

# Tyyli
colored = "3"
indicatif = "0.17"

# Sisäiset (vain tyyppejä jos tarvitaan)
familyclaw-core = { workspace = true }
