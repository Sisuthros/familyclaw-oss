[package]
name = "familyclaw-gemu"
description = "Gemu CLI — Geminin rälläkkäliittymä FamilyClaw'n rasvamonttuun"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "gemu"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Sarjallistus + async-ajoaika
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# CLI
clap = { version = "4", features = ["derive"] }

# Virheet
anyhow = { workspace = true }
thiserror = { workspace = true }

# Sisäiset (vain tyyppejä jos tarvitaan)
familyclaw-core = { workspace = true }
