[package]
name = "familyclaw-channels"
description = "Unified messaging channel abstraction; Discord, Telegram, and Slack adapters implemented; WhatsApp/Signal features reserved (empty flags)"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["chat", "messaging", "discord", "telegram", "bot"]
categories = ["asynchronous", "network-programming"]

[lints]
workspace = true

[dependencies]
familyclaw-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# Telegram adapter: lightweight HTTP REST (no teloxide SDK) via Bot API
# getUpdates/sendMessage. Discord webhook interactions (discord_interactions.rs)
# use reqwest + ed25519-dalek for signature verification.
reqwest = { workspace = true, optional = true }
ed25519-dalek = { version = "2.2", optional = true }

# Discord gateway adapter (discord.rs): serenity 0.12 with gateway.
# default-features = false → leanest working set (no cache/framework/utils);
# rustls_backend avoids a system OpenSSL dependency.
serenity = { version = "0.12", default-features = false, features = [
    "builder",
    "cache",
    "client",
    "gateway",
    "http",
    "model",
    "rustls_backend",
], optional = true }

[features]
# Default: core + MockChannel only. Real adapters behind feature flags.
default = []
discord = ["dep:reqwest", "dep:ed25519-dalek", "dep:serenity"]
telegram = ["dep:reqwest"]
slack = ["dep:reqwest"]
# Reserved / not implemented — empty flags so the names are reserved; no adapter source yet.
whatsapp = []
signal = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }
