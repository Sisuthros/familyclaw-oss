[package]
name = "familyclaw-channels"
description = "Discord/Telegram/WhatsApp/Signal channel layer"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
familyclaw-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# Discord/Telegram adapters: HTTP REST (lightweight, no gateway/teloxide SDK).
# Discord sends via webhook URL; Telegram uses Bot API getUpdates/sendMessage.
reqwest = { workspace = true, optional = true }
ed25519-dalek = { version = "2.2", optional = true }

[features]
# Default: runko + MockChannel only. Real adapters behind feature flags.
default = []
discord = ["dep:reqwest", "dep:ed25519-dalek"]
telegram = ["dep:reqwest"]
whatsapp = []
signal = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }