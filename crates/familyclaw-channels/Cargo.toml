[package]
name = "familyclaw-channels"
description = "Discord/Telegram/WhatsApp/Signal channel layer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
familyclaw-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# Discord adapter: HTTP webhook (lightweight, no gateway SDK needed).
# Sends via webhook URL, receives via polling or future gateway integration.
reqwest = { version = "0.12", optional = true }

[features]
# Default: runko + MockChannel only. Real adapters behind feature flags.
default = []
discord = ["dep:reqwest"]
telegram = []
whatsapp = []
signal = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }