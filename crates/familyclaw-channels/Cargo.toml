[package]
name = "familyclaw-channels"
description = "Unified messaging channel abstraction with feature-gated adapters for Discord, Telegram, WhatsApp, and Signal"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["chat", "messaging", "discord", "telegram", "bot"]
categories = ["asynchronous", "network-programming"]

[lints]
workspace = true

[dependencies]
familyclaw-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# Telegram adapter: HTTP REST (lightweight, no teloxide SDK) via Bot API
# getUpdates/sendMessage. Discord webhook-interaktiot (discord_interactions.rs)
# käyttävät reqwest + ed25519-dalek allekirjoitusten verifiointiin.
reqwest = { workspace = true, optional = true }
ed25519-dalek = { version = "2.2", optional = true }

# Discord gateway -adapteri (discord.rs): serenity 0.12 gateway-yhteydellä.
# default-features = false → kevein toimiva setti (ei cache/framework/utils);
# rustls_backend välttää järjestelmän OpenSSL-riippuvuuden.
serenity = { version = "0.12", default-features = false, features = [
    "builder",
    "cache",
    "client",
    "gateway",
    "http",
    "model",
    "rustls_backend",
], optional = true }

[features]
# Default: runko + MockChannel only. Real adapters behind feature flags.
default = []
discord = ["dep:reqwest", "dep:ed25519-dalek", "dep:serenity"]
telegram = ["dep:reqwest"]
whatsapp = []
signal = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }