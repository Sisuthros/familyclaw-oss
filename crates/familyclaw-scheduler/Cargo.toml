[package]
name = "familyclaw-scheduler"
description = "Minimal interval-based scheduler that dispatches proactive agent tool tasks through an idempotent submission path"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["scheduler", "cron", "agent", "idempotent", "async"]
categories = ["asynchronous", "date-and-time"]

[lints]
workspace = true

[dependencies]
familyclaw-core = { workspace = true }
familyclaw-actions = { workspace = true }
chrono = { workspace = true }
croner = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "time", "sync"] }
async-trait = { workspace = true }
