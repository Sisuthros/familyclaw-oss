[package]
name = "familyclaw-hearth"
description = "The Hearth — perheen jaettu muisti, narratiivit, tunnetila ja ankkurit"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
surreal = ["dep:surrealdb"]

[dependencies]
familyclaw-core = { workspace = true }
familyclaw-memory = { workspace = true }
familyclaw-security = { workspace = true }
familyclaw-emotion = { workspace = true }
familyclaw-bus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
surrealdb = { version = "3", optional = true, features = ["kv-mem"] }
cfg-if = { version = "1", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
