<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FamilyClaw Reliability Console</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#0a0e17;
      --panel:#121826;
      --panel-2:#0e1420;
      --line:#243047;
      --text:#eef3ff;
      --muted:#8fa0bf;
      --green:#3dd68c;
      --red:#ff6b7a;
      --amber:#f0b429;
      --orange:#ff8a4c;
      --blue:#6ea8ff;
      --violet:#9b7bff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(900px 420px at 12% -8%, #1a2a4a 0%, transparent 55%),
        radial-gradient(700px 360px at 90% 0%, #24183a 0%, transparent 50%),
        var(--bg);
      color:var(--text);
      font:15px/1.5 "Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    }
    main{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
    .brand{display:flex;gap:14px;align-items:center}
    .mark{
      width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
      background:linear-gradient(145deg,var(--blue),var(--violet));
      box-shadow:0 10px 36px #6ea8ff33;font-size:18px;font-weight:700;
    }
    .title{font-size:1.35rem;font-weight:720;letter-spacing:-.02em}
    .subtitle{color:var(--muted);font-size:.86rem;margin-top:2px}
    .top-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
    .status{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.86rem}
    .dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px #ff6b7a22}
    .status.connected .dot{background:var(--green);box-shadow:0 0 0 4px #3dd68c22}
    .token{
      border:1px solid var(--line);background:transparent;color:var(--muted);
      border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;
    }
    .token:hover{border-color:#3a4d72;color:var(--text)}

    /* Hermes-style NOW strip — always answer "what is the agent doing?" */
    .now{
      position:sticky;top:0;z-index:5;margin-bottom:18px;padding:14px 16px;
      border:1px solid var(--line);border-radius:14px;
      background:linear-gradient(180deg,#152033ee,#101826f2);
      backdrop-filter:blur(10px);
      display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
      box-shadow:0 12px 40px #0005;
    }
    .now-badge{
      font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
      padding:5px 8px;border-radius:999px;background:#1d2d4a;color:var(--blue);
      border:1px solid #2f456c;
    }
    .now.waiting .now-badge{background:#3a2418;color:var(--orange);border-color:#6a3d22}
    .now.tooling .now-badge{background:#3a2f14;color:var(--amber);border-color:#6a541f}
    .now.idle .now-badge{background:#1a2436;color:var(--muted);border-color:var(--line)}
    .now-label{font-weight:700;font-size:1rem}
    .now-detail{color:var(--muted);font-size:.88rem;margin-top:2px;overflow-wrap:anywhere}
    .now-meta{text-align:right;color:var(--muted);font-size:.78rem;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .now-pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-right:6px;animation:pulse 1.4s infinite}
    .now.waiting .now-pulse{background:var(--orange)}
    .now.tooling .now-pulse{background:var(--amber)}

    .section-title{
      display:flex;align-items:center;gap:8px;margin:0 0 12px;
      font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:#b4c2e0;
    }
    .count{font-size:.7rem;color:var(--muted);border:1px solid var(--line);padding:1px 7px;border-radius:999px}
    .panel{
      background:color-mix(in srgb, var(--panel) 92%, transparent);
      border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px #0003;
    }
    #approvals{display:none;margin-bottom:18px;padding:16px 18px}
    .approval{
      display:grid;grid-template-columns:1fr auto;gap:14px;padding:14px 0;
      border-top:1px solid var(--line);
    }
    .approval:first-of-type{border-top:0;padding-top:2px}
    .approval-summary{font-weight:650}
    .approval-id{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);margin-top:3px}
    .ttl{font-size:.8rem;color:var(--muted);margin-top:8px}
    .ttl.urgent{color:var(--red);font-weight:700}
    .actions{display:flex;gap:8px;align-items:center}
    button.action{
      border:0;border-radius:9px;padding:9px 13px;font:inherit;font-weight:720;cursor:pointer;min-width:84px;
    }
    button.approve{background:var(--green);color:#062314}
    button.deny{background:var(--red);color:#2a060c}
    button:disabled{opacity:.55;cursor:wait}
    .spinner{
      display:inline-block;width:12px;height:12px;border:2px solid currentColor;
      border-right-color:transparent;border-radius:50%;animation:spin .65s linear infinite;
    }

    .feed{overflow:hidden}
    .feed-head{
      display:flex;justify-content:space-between;align-items:center;
      padding:16px 18px 12px;border-bottom:1px solid var(--line);
    }
    .feed-head .section-title{margin:0}
    .live{font-size:.78rem;color:var(--muted)}
    #events{padding:8px 12px 14px;min-height:260px}
    .event{
      --group:var(--blue);
      display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:start;
      margin:8px 0;padding:13px 12px;border-left:3px solid var(--group);
      background:var(--panel-2);border-radius:10px;animation:enter .28s ease-out;
    }
    .icon{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#1a2740;font-size:14px}
    .event-main{min-width:0}
    .event-kind{font-weight:720;font-size:.88rem}
    .detail{color:#c2cce4;margin-top:2px;overflow-wrap:anywhere}
    .chip{
      display:inline-block;margin-top:7px;padding:2px 7px;border:1px solid #334263;
      border-radius:6px;color:#9eb4e4;font:11px ui-monospace,SFMono-Regular,Consolas,monospace;
    }
    .when{color:var(--muted);font-size:.78rem;white-space:nowrap}
    .empty{
      display:grid;place-items:center;min-height:220px;color:var(--muted);text-align:center;padding:28px;
    }
    .pulse{width:8px;height:8px;background:var(--blue);border-radius:50%;margin:0 auto 12px;animation:pulse 1.6s infinite}
    .toast{
      position:fixed;right:18px;bottom:18px;max-width:360px;padding:12px 15px;border-radius:10px;
      background:#1b2947;border:1px solid #385585;box-shadow:0 12px 40px #0007;
      transform:translateY(90px);opacity:0;transition:.25s;z-index:20;
    }
    .toast.show{transform:none;opacity:1}
    .toast.error{border-color:#a53f54;background:#321923}
    .new-approval{animation:approvalPulse 1.5s ease-out}
    @keyframes enter{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
    @keyframes pulse{50%{transform:scale(1.9);opacity:.25}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes approvalPulse{30%{box-shadow:0 0 0 5px #f0b42933}}
    @media(max-width:700px){
      main{padding:18px 12px 72px}
      .top{flex-direction:column}
      .top-right{align-items:flex-start}
      .now{grid-template-columns:1fr;gap:8px}
      .now-meta{text-align:left}
      .approval{grid-template-columns:1fr}
      .event{grid-template-columns:30px 1fr}
      .when{grid-column:2}
      .subtitle{display:none}
    }
  </style>
</head>
<body>
<main>
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">◈</div>
      <div>
        <div class="title">FamilyClaw Reliability Console</div>
        <div class="subtitle">See every turn, tool call, and approval — live</div>
      </div>
    </div>
    <div class="top-right">
      <div id="connection" class="status" role="status"><span class="dot"></span><span>reconnecting…</span></div>
      <button class="token" id="token-button" type="button">token</button>
    </div>
  </header>

  <section id="now" class="now idle" aria-live="polite" aria-atomic="true">
    <div class="now-badge">Now</div>
    <div>
      <div class="now-label"><span class="now-pulse" aria-hidden="true"></span><span id="now-label">Waiting for the agent…</span></div>
      <div class="now-detail" id="now-detail">When a turn starts, this strip tracks exactly what it is doing.</div>
    </div>
    <div class="now-meta" id="now-meta">—</div>
  </section>

  <section id="approvals" class="panel" aria-labelledby="approvals-title">
    <h2 id="approvals-title" class="section-title">Pending approvals <span id="approval-count" class="count">0</span></h2>
    <div id="approval-list"></div>
  </section>

  <section class="feed panel" aria-labelledby="activity-title">
    <div class="feed-head">
      <h2 id="activity-title" class="section-title">Live activity</h2>
      <span class="live">Streaming redacted audit events</span>
    </div>
    <div id="events" aria-live="polite" aria-relevant="additions">
      <div class="empty"><div><div class="pulse"></div>Waiting for agent activity…</div></div>
    </div>
  </section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  const key = "familyclaw-console-token";
  let token = localStorage.getItem(key) || "";
  const bootstrap = new URLSearchParams(location.search).get("token");
  if (bootstrap) {
    token = bootstrap;
    localStorage.setItem(key, token);
    history.replaceState({}, "", location.pathname);
  }

  const connection = document.querySelector("#connection");
  const events = document.querySelector("#events");
  const approvals = document.querySelector("#approvals");
  const approvalList = document.querySelector("#approval-list");
  const toast = document.querySelector("#toast");
  const nowEl = document.querySelector("#now");
  const nowLabel = document.querySelector("#now-label");
  const nowDetail = document.querySelector("#now-detail");
  const nowMeta = document.querySelector("#now-meta");
  const approvalIds = new Set();

  const authHeaders = () => token ? { Authorization: `Bearer ${token}` } : {};
  const endpoint = path => token
    ? `${path}${path.includes("?") ? "&" : "?"}token=${encodeURIComponent(token)}`
    : path;
  const esc = value => String(value || "").slice(0, 220);
  const short = id => {
    const s = esc(id);
    return s.length <= 14 ? s : `${s.slice(0, 8)}…${s.slice(-4)}`;
  };
  const hashColor = id => ["#6ea8ff","#9b7bff","#3dd68c","#f0b429","#ff8a4c"][
    [...esc(id)].reduce((n, c) => n + c.charCodeAt(0), 0) % 5
  ];
  const relative = timestamp => {
    const seconds = Math.max(0, Math.floor((Date.now() - new Date(timestamp).getTime()) / 1000));
    if (!Number.isFinite(seconds)) return "—";
    if (seconds < 5) return "now";
    if (seconds < 60) return `${seconds}s ago`;
    if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
    return `${Math.floor(seconds / 3600)}h ago`;
  };
  const toastMessage = (message, error = false) => {
    toast.textContent = message;
    toast.className = `toast show${error ? " error" : ""}`;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => { toast.className = "toast"; }, 3600);
  };

  const metadata = {
    turn_started: ["▶", "Turn started", "blue", "working", "Thinking / starting a turn"],
    tool_dispatched: ["⚙", "Tool dispatched", "amber", "tooling", "Running a tool"],
    turn_suspended: ["⏸", "Waiting for approval", "orange", "waiting", "Paused — needs your decision"],
    turn_resumed: ["▶", "Turn resumed", "green", "working", "Resumed after approval"],
    turn_answered: ["✔", "Turn answered", "green", "idle", "Turn finished"],
    turn_max_iterations: ["⚠", "Iteration limit reached", "red", "idle", "Stopped at max iterations"],
  };

  function setNow(item) {
    const meta = metadata[item.kind] || ["•", item.kind || "Event", "blue", "working", esc(item.detail)];
    nowEl.className = `now ${meta[3]}`;
    nowLabel.textContent = meta[4];
    nowDetail.textContent = esc(item.detail) || meta[1];
    nowMeta.innerHTML = `${short(item.action_id)}<br>${relative(item.at)}`;
    nowMeta.dataset.at = item.at || "";
  }

  function eventCard(item) {
    const [icon, label, color] = metadata[item.kind] || ["•", item.kind || "Audit event", "blue"];
    const card = document.createElement("article");
    card.className = "event";
    card.style.setProperty("--group", hashColor(item.action_id));
    card.innerHTML =
      `<div class="icon" style="color:var(--${color})">${icon}</div>` +
      `<div class="event-main"><div class="event-kind" style="color:var(--${color})">${label}</div>` +
      `<div class="detail"></div><span class="chip">${short(item.action_id)}</span></div>` +
      `<time class="when" datetime="${esc(item.at)}">${relative(item.at)}</time>`;
    card.querySelector(".detail").textContent = esc(item.detail);
    return card;
  }

  function addEvent(item) {
    const empty = events.querySelector(".empty");
    if (empty) empty.remove();
    events.prepend(eventCard(item));
    while (events.children.length > 120) events.lastElementChild.remove();
    setNow(item);
    if (item.kind === "turn_suspended") refreshApprovals();
  }

  function tick() {
    document.querySelectorAll(".when").forEach(node => {
      node.textContent = relative(node.dateTime);
    });
    if (nowMeta.dataset.at) {
      const idLine = nowMeta.textContent.split("\n")[0] || "—";
      nowMeta.innerHTML = `${idLine}<br>${relative(nowMeta.dataset.at)}`;
    }
    document.querySelectorAll(".ttl").forEach(node => {
      const seconds = Math.max(0, Math.ceil((new Date(node.dataset.expires).getTime() - Date.now()) / 1000));
      node.textContent = seconds
        ? `Expires in ${seconds < 60 ? `${seconds}s` : `${Math.ceil(seconds / 60)}m`}`
        : "Expired";
      node.classList.toggle("urgent", seconds < 60);
    });
  }

  async function decide(id, decision, button) {
    const original = button.innerHTML;
    button.disabled = true;
    button.innerHTML = '<span class="spinner" aria-label="Working"></span>';
    try {
      const response = await fetch(`/approvals/${encodeURIComponent(id)}/${decision}`, {
        method: "POST",
        headers: authHeaders(),
      });
      if (!response.ok) {
        throw new Error((await response.json().catch(() => ({}))).error || `Request failed (${response.status})`);
      }
      toastMessage(decision === "approve" ? "Approval sent — agent is resuming." : "Denied — agent will not dispatch.");
      refreshApprovals();
    } catch (error) {
      toastMessage(error.message, true);
      button.disabled = false;
      button.innerHTML = original;
    }
  }

  function renderApprovals(items) {
    const list = Array.isArray(items) ? items : (items && items.pending) || [];
    const fresh = list.some(item => !approvalIds.has(item.approval_id));
    approvalIds.clear();
    list.forEach(item => approvalIds.add(item.approval_id));
    document.querySelector("#approval-count").textContent = list.length;
    approvals.style.display = list.length ? "block" : "none";
    approvalList.replaceChildren();
    if (!list.length) return;
    list.forEach(item => {
      const row = document.createElement("article");
      row.className = "approval";
      const expires = item.expires_at || item.created_at;
      row.innerHTML =
        `<div><div class="approval-summary"></div><div class="approval-id">${short(item.approval_id)}</div>` +
        `<div class="ttl" data-expires="${esc(expires)}"></div></div>` +
        `<div class="actions"><button class="action approve" type="button">Approve</button>` +
        `<button class="action deny" type="button">Deny</button></div>`;
      row.querySelector(".approval-summary").textContent = esc(item.redacted_summary || item.summary || "Pending approval");
      row.querySelector(".approve").onclick = () => decide(item.approval_id, "approve", row.querySelector(".approve"));
      row.querySelector(".deny").onclick = () => decide(item.approval_id, "deny", row.querySelector(".deny"));
      approvalList.append(row);
    });
    if (fresh) approvals.classList.add("new-approval");
    setTimeout(() => approvals.classList.remove("new-approval"), 1500);
    tick();
  }

  async function refreshApprovals() {
    try {
      const response = await fetch("/approvals/pending", { headers: authHeaders() });
      if (response.status === 401) throw new Error("Authentication required — set token");
      if (!response.ok) throw new Error("Could not refresh approvals");
      renderApprovals(await response.json());
    } catch (error) {
      toastMessage(error.message, true);
    }
  }

  function connect() {
    const source = new EventSource(endpoint("/console/events"));
    source.onopen = () => {
      connection.classList.add("connected");
      connection.lastElementChild.textContent = "live";
    };
    source.onerror = () => {
      connection.classList.remove("connected");
      connection.lastElementChild.textContent = "reconnecting…";
    };
    source.onmessage = message => {
      try { addEvent(JSON.parse(message.data)); }
      catch (_) { toastMessage("Received an unreadable activity event.", true); }
    };
  }

  document.querySelector("#token-button").onclick = () => {
    const value = prompt("Gateway bearer token (leave blank to clear):", token);
    if (value === null) return;
    token = value.trim();
    if (token) localStorage.setItem(key, token);
    else localStorage.removeItem(key);
    location.assign("/console" + (token ? `?token=${encodeURIComponent(token)}` : ""));
  };

  refreshApprovals();
  connect();
  setInterval(refreshApprovals, 5000);
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
