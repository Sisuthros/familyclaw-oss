[package]
name = "familyclaw-gateway"
description = "FamilyClaw gateway binary — long-running process: HTTP health/readiness + Resonance Bus bootstrap"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["agent", "gateway", "http", "runtime", "server"]
categories = ["command-line-utilities", "asynchronous"]

[[bin]]
name = "familyclaw-gateway"
path = "src/main.rs"

[features]
# Kytkee oikean wasmtime-pohjaisen hiekkalaatikon (host-import-esto + fuel-katto)
# passthrough-piirteenä `familyclaw-sandbox/wasmtime`:een. Oletuksena POIS:
# wasmtime on iso riippuvuus (Cranelift + JIT). doctor/status raportoivat
# saatavuuden TODELLISEN käännetyn backendin mukaan
# ([`familyclaw_sandbox::sandbox_availability`]) — ei irrallista lippua, joten
# raportti ei voi valehdella saatavuudesta.
wasmtime = ["familyclaw-sandbox/wasmtime"]

# Kytkee OllamaEmbedderin (aito semanttinen muisti-recall) passthrough-piirteenä
# `familyclaw-runtime/ollama`:aan. Aja gateway `--features ollama` + env
# FAMILYCLAW_EMBED_PROVIDER=ollama, niin recall käyttää oikeaa embedderiä.
ollama = ["familyclaw-runtime/ollama"]

[lints]
workspace = true

[dependencies]
toml = "0.8"
serde = { workspace = true }
familyclaw-core = { workspace = true }
familyclaw-bus = { workspace = true }
familyclaw-runtime = { workspace = true }
familyclaw-scheduler = { workspace = true }
familyclaw-agent = { workspace = true }
# orchestrate-alikomennolle: Orchestrator + FamilyBridge + OrchestrationPlan.
# Ei sykliä: bridge riippuu vain coresta. (familyclaw-agent re-exportaa vain
# LiveTurnExecutorin, ei orkesteri-tyyppejä, joten bridge tarvitaan suoraan.)
familyclaw-bridge = { workspace = true }
# Operaattorin hyväksyntäpinta (GET /approvals/pending, POST /approvals/{id}/approve):
# jakaa runtimen Arc<Mutex<ActionRuntime>>-kahvan listatakseen odottavat
# hyväksynnät redaktoituina ja myöntääkseen hyväksynnän (suspend/resume-silta).
familyclaw-actions = { workspace = true }
# GET /metrics: jaettu MetricsRegistry (with_fleet_defaults) joka viedään
# deterministisessä Prometheus-tekstiformaatissa (prometheus_export).
familyclaw-observability = { workspace = true }
# doctor/status: hiekkalaatikon saatavuus (wasmtime vs noop). Kevyt ilman
# wasmtime-featurea (vain NoopSandbox); gatewayn `wasmtime`-passthrough kytkee
# oikean backendin tarvittaessa.
familyclaw-sandbox = { workspace = true }
familyclaw-channels = { workspace = true, features = ["telegram", "discord"] }
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
clap = { version = "4", features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
# Phase 3: status/doctor raportoi aktiivisen upotustarjoajan (embedder_label).
familyclaw-embeddings = { workspace = true }
# Phase 4: kill-switch-reitti jäsentää ScheduledTaskId:n UUID-stringistä.
uuid = { workspace = true }

[dev-dependencies]
# E2E suspend→approve→resume -testi rakentaa AIDON agentin skriptatulla LLM:llä
# in-crate (build_router + GatewayState ovat privaatteja → testi elää
# main.rs:n tests-moduulissa). Agent::new vaatii durable- + muisti-kontekstin,
# CountingApprovalSkill toteuttaa ActionExecutor/Skill-traitit (async_trait +
# deterministinen uuid skill-id:lle).
familyclaw-durable = { workspace = true }
familyclaw-memory = { workspace = true }
async-trait = { workspace = true }
# Phase 4 kill-switch -reittitesti rakentaa ScheduledTaskin (interval = chrono::Duration).
chrono = { workspace = true }
