[package]
name = "familyclaw-gateway"
description = "FamilyClaw gateway binary — long-running process: HTTP health/readiness + Resonance Bus bootstrap"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "familyclaw-gateway"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
toml = "0.8"
serde = { workspace = true }
familyclaw-core = { workspace = true }
familyclaw-bus = { workspace = true }
familyclaw-runtime = { workspace = true }
familyclaw-agent = { workspace = true }
# orchestrate-alikomennolle: Orchestrator + FamilyBridge + OrchestrationPlan.
# Ei sykliä: bridge riippuu vain coresta. (familyclaw-agent re-exportaa vain
# LiveTurnExecutorin, ei orkesteri-tyyppejä, joten bridge tarvitaan suoraan.)
familyclaw-bridge = { workspace = true }
# Operaattorin hyväksyntäpinta (GET /approvals/pending, POST /approvals/{id}/approve):
# jakaa runtimen Arc<Mutex<ActionRuntime>>-kahvan listatakseen odottavat
# hyväksynnät redaktoituina ja myöntääkseen hyväksynnän (suspend/resume-silta).
familyclaw-actions = { workspace = true }
familyclaw-channels = { workspace = true, features = ["telegram", "discord"] }
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
clap = { version = "4", features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
