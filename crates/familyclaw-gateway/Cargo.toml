[package]
name = "familyclaw-gateway"
description = "FamilyClaw gateway binary — long-running process: HTTP health/readiness + Resonance Bus bootstrap"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "familyclaw-gateway"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
familyclaw-core = { workspace = true }
familyclaw-bus = { workspace = true }
familyclaw-runtime = { workspace = true }
familyclaw-agent = { workspace = true }
familyclaw-channels = { workspace = true, features = ["telegram"] }
tokio = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
