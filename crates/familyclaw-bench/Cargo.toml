[package]
name = "familyclaw-bench"
description = "Continuity benchmark harness — reproducible proof of crash-resume, retention and dreaming"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
familyclaw-core = { workspace = true }
familyclaw-durable = { workspace = true }
familyclaw-memory = { workspace = true }
familyclaw-dream = { workspace = true }
familyclaw-agent = { workspace = true }
familyclaw-bus = { workspace = true }
familyclaw-emotion = { workspace = true }
familyclaw-hearth = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

# Benchmark CLI: ajaa skenaariot ja kirjoittaa scorecardin.
[[bin]]
name = "bench"
path = "src/bin/bench.rs"
