[package]
name = "familyclaw-bench"
description = "Continuity benchmark harness — reproducible proof of crash-resume, retention and dreaming"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Oletuksena ei mitään lisää. `wasmtime` kytkee oikean sandbox-backendin, jota
# turvabenchin SEC1/SEC2 tarvitsevat ajaakseen WASMia (fuel-portti + host-import-
# esto). Ilman featurea turvabenchi ajaa yhä, mutta SEC1/SEC2 raportoivat
# rehellisesti että oikeaa WASM-ajoa ei tehty.
default = []
wasmtime = ["familyclaw-sandbox/wasmtime"]

[dependencies]
familyclaw-core = { workspace = true }
familyclaw-durable = { workspace = true }
familyclaw-embeddings = { workspace = true }
familyclaw-memory = { workspace = true }
familyclaw-dream = { workspace = true }
familyclaw-agent = { workspace = true }
familyclaw-actions = { workspace = true }
familyclaw-sandbox = { workspace = true }
familyclaw-bus = { workspace = true }
familyclaw-emotion = { workspace = true }
familyclaw-hearth = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
# WAT → WASM -käännös turvabenchin sandbox-skenaarioihin (SEC1/SEC2).
wat = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

# Benchmark CLI: ajaa skenaariot ja kirjoittaa scorecardin.
[[bin]]
name = "bench"
path = "src/bin/bench.rs"
