name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  layer-b-audit:
    name: Layer B leak audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: audit check #12 scans commit author/committer
          # metadata across all refs. The default shallow clone (depth 1)
          # would make that check inspect exactly one commit and report a
          # meaningless PASS.
          fetch-depth: 0

      - name: Run Layer B leak audit
        # The operator-local real name list cannot exist on a public runner,
        # so placeholder mode is opted into EXPLICITLY here. Without this the
        # audit refuses to run (exit 2) rather than silently scanning for
        # placeholder strings and reporting a false PASS -- which is exactly
        # what it used to do. A CI pass in this mode is a contributor guard,
        # NOT publish clearance; scripts/pre-publish-scan.sh has no such mode
        # and must be run locally with the real list before going public.
        env:
          FAMILYCLAW_AUDIT_ALLOW_PLACEHOLDER_NAMES: "1"
        run: bash scripts/audit-layer-b.sh

      - name: Run Layer B audit regression tests
        run: bash scripts/test-audit-layer-b.sh

  check:
    name: Check, Build, and Test
    needs: layer-b-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace (default features)
        run: cargo build --workspace

      - name: Build workspace (discord feature)
        run: cargo build --workspace --features discord

      - name: Clippy (discord feature)
        run: cargo clippy --workspace --all-targets --features discord -- -D warnings

      - name: Run unit tests
        run: cargo test --workspace --features discord

      - name: Generate documentation
        run: cargo doc --no-deps --features discord
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Run Discord Integration Tests
        if: env.DISCORD_TEST_TOKEN != ''
        run: cargo test --workspace --features discord --test discord_integration
        env:
          DISCORD_TEST_TOKEN: ${{ secrets.DISCORD_TEST_TOKEN }}
          DISCORD_TEST_CHANNEL_ID: ${{ secrets.DISCORD_TEST_CHANNEL_ID }}

  feature-isolation:
    name: Feature isolation (${{ matrix.name }})
    needs: layer-b-audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: channels/telegram
            crate: familyclaw-channels
            feature: telegram
          - name: channels/whatsapp
            crate: familyclaw-channels
            feature: whatsapp
          - name: channels/signal
            crate: familyclaw-channels
            feature: signal
          - name: gateway/wasmtime
            crate: familyclaw-gateway
            feature: wasmtime
          - name: sandbox/wasmtime
            crate: familyclaw-sandbox
            feature: wasmtime
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      # Each entry tests exactly ONE feature enabled in isolation (no `discord`,
      # no `--all-features`). This catches a bug that only manifests when a
      # single feature is compiled alone — --all-features enables every feature
      # together and can mask a feature that is broken (or that silently
      # depends on another feature) in isolation.
      - name: cargo test -p ${{ matrix.crate }} --no-default-features --features ${{ matrix.feature }}
        run: cargo test -p ${{ matrix.crate }} --no-default-features --features ${{ matrix.feature }}

  msrv:
    name: MSRV (1.88)
    needs: layer-b-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.88

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: cargo check --workspace
        run: cargo check --workspace

  all-features:
    name: Test (all features)
    needs: layer-b-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      # familyclaw-bench integration tests spawn the continuity_daemon binary
      # as a child process and locate it already built under target/debug/.
      # `cargo test --workspace` does NOT build another crate's [[bin]]
      # target for the test run, so the daemon must be built explicitly
      # before tests — otherwise familyclaw_subject.rs panics with "binary not found".
      - name: Build continuity_daemon binary (familyclaw-bench process boundary)
        run: cargo build -p familyclaw-agent --bin continuity_daemon

      # We use --all-features (NOT an explicit feature list) on purpose:
      # it's the only gate that catches ANY workspace feature breaking,
      # including newly added ones. Regression this prevents (2026-07): familyclaw-hearth's
      # `surreal` feature broke (test + rustdoc) and slipped through CI because this
      # job listed features by hand and left `surreal` out. Now all features
      # (including surreal) are activated, and test + doc + clippy run with them.
      # Sandbox: --all-features activates both familyclaw-gateway/wasmtime and
      # familyclaw-sandbox/wasmtime, so the gateway's own `cfg!(feature = "wasmtime")`
      # stays in sync with the compiled backend and
      # sandbox_label_matches_compiled_feature passes (verified locally).
      - name: cargo test --workspace --all-features
        run: cargo test --workspace --all-features

      # Doc with all-features -D warnings: catches broken rustdoc links even in
      # feature-gated modules (e.g. surreal.rs) that default/discord-doc doesn't cover.
      - name: cargo doc --workspace --all-features (-D warnings)
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

      # Clippy with all-features -D warnings: catches lint breaks in feature-gated
      # code that discord-only-clippy (check + windows-msvc-lint) doesn't compile.
      - name: cargo clippy --workspace --all-features --all-targets (-D warnings)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Continuity scorecard gate (bench all)
        run: cargo run -p familyclaw-bench --bin bench -- all

      # Public proof: the scorecard shows up directly in the run page's Summary
      # section, so a skeptic sees the 8/8 result without cloning or a toolchain.
      - name: Publish scorecard to job summary
        run: cat crates/familyclaw-bench/out/SCORECARD.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scorecard artifact
        uses: actions/upload-artifact@v4
        with:
          name: continuity-scorecard
          path: |
            crates/familyclaw-bench/out/SCORECARD.md
            crates/familyclaw-bench/out/scorecard.json

  windows:
    name: Build and Test (Windows)
    needs: layer-b-audit
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build workspace (discord feature)
        run: cargo build --workspace --features discord

      - name: Run unit tests (discord feature)
        run: cargo test --workspace --features discord

      # Mirrors the `all-features` (ubuntu) job: familyclaw-bench integration
      # tests spawn the continuity_daemon binary as a child process and locate
      # it already built under target/debug/ (target\debug\continuity_daemon.exe
      # on Windows). `cargo test --workspace` does not build another crate's
      # [[bin]] target for the test run, so it must be built explicitly first
      # or familyclaw_subject.rs panics with "binary not found".
      - name: Build continuity_daemon binary (familyclaw-bench process boundary)
        run: cargo build -p familyclaw-agent --bin continuity_daemon

      # Windows never previously built --all-features, so the wasmtime sandbox
      # backend (familyclaw-gateway/wasmtime -> familyclaw-sandbox/wasmtime,
      # Cranelift + JIT) was unverified on MSVC. This closes that gap.
      - name: cargo test --workspace --all-features
        run: cargo test --workspace --all-features

  windows-msvc-lint:
    # Phase 0 (v1.0 roadmap): the per-phase "green on MSVC" gate must be enforced
    # by ONE machine. The `check` job runs clippy/doc on ubuntu; the `windows` job
    # runs only build+test. This job closes that gap: clippy (pedantic, -D warnings)
    # AND doc (-D warnings) on windows-latest (MSVC stable), with the SAME feature
    # set the ubuntu `check` job uses. Add each future phase's feature flag here so
    # no Windows-only lint/doc break behind a new feature can pass CI.
    name: Clippy + Doc (Windows / MSVC)
    needs: layer-b-audit
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy (discord feature, pedantic -D warnings)
        run: cargo clippy --workspace --all-targets --features discord -- -D warnings

      - name: Generate documentation (discord feature)
        run: cargo doc --no-deps --features discord
        env:
          RUSTDOCFLAGS: "-D warnings"

  cargo-audit:
    name: cargo audit
    needs: layer-b-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        # cargo-audit does NOT read deny.toml -> ignores must be repeated here.
        # Keep in sync with deny.toml's [advisories].ignore list.
        # Rationale: rsa Marvin (no fix), rustls-webpki (discord chain,
        # no fixed serenity version), atomic-polyfill+number_prefix
        # (unmaintained, not a vulnerability). wasmtime advisories fixed 35->45.
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0049 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2023-0089 \
            --ignore RUSTSEC-2025-0119

  cargo-deny:
    name: cargo deny
    needs: layer-b-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo deny check
        run: cargo deny check
