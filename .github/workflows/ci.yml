name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings -A clippy::doc_markdown -A clippy::too_many-lines

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  layer-b-audit:
    name: Layer B Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Layer B contamination
        run: |
          set -e
          echo "=== Layer B Audit ==="
          # No soul files
          if find . -name "*.soul" -o -name "*.soul.md" | grep -v docs | grep -q .; then
            echo "FAIL: soul files found"
            exit 1
          fi
          # No SOUL.md except example
          if find . -name "SOUL.md" | grep -v docs | grep -q .; then
            echo "FAIL: SOUL.md found outside docs"
            exit 1
          fi
          # No calibration files
          if find . -name "*.calibration.json" | grep -v docs | grep -q .; then
            echo "FAIL: calibration files found"
            exit 1
          fi
          # Check for actual hardcoded secrets (not field names)
          if grep -rE "(api_key|API_KEY|secret|token)\s*=\s*[\"'\"'\"'][^\"'\"'\"']{10,}" --include="*.rs" --include="*.toml" crates/ | grep -q .; then
            echo "FAIL: Hardcoded secrets found in source"
            exit 1
          fi
          # No .env files
          if find . -name ".env" -o -name ".env.*" | grep -v "\.env\.example" | grep -q .; then
            echo "FAIL: .env files found"
            exit 1
          fi
          echo "Layer B audit passed - no contamination found"

  feature-matrix:
    name: Feature Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        command:
          - cargo test --workspace --all-features
          - cargo check -p familyclaw-channels --features discord
          - cargo test -p familyclaw-sandbox --features wasmtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ${{ matrix.command }}