name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  layer-b-audit:
    name: Layer B leak audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Layer B leak audit
        run: bash scripts/audit-layer-b.sh

  check:
    name: Check, Build, and Test
    needs: layer-b-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace (default features)
        run: cargo build --workspace

      - name: Build workspace (discord feature)
        run: cargo build --workspace --features discord

      - name: Clippy (discord feature)
        run: cargo clippy --workspace --all-targets --features discord -- -D warnings

      - name: Run unit tests
        run: cargo test --workspace --features discord

      - name: Generate documentation
        run: cargo doc --no-deps --features discord
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Run Discord Integration Tests
        if: env.DISCORD_TEST_TOKEN != ''
        run: cargo test --workspace --features discord --test discord_integration
        env:
          DISCORD_TEST_TOKEN: ${{ secrets.DISCORD_TEST_TOKEN }}
          DISCORD_TEST_CHANNEL_ID: ${{ secrets.DISCORD_TEST_CHANNEL_ID }}

  msrv:
    name: MSRV (1.85)
    needs: layer-b-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.85

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: cargo check --workspace
        run: cargo check --workspace

  all-features:
    name: Test (all features)
    needs: layer-b-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      # familyclaw-gateway is binary-only; --workspace (not --lib) includes its tests.
      # NB: emme käytä --all-features koska se aktivoisi familyclaw-hearthin
      # `surreal`-featuren, joka kääntää kytkemättömän, API-vanhentuneen
      # SurrealDB-backendin (8 käännösvirhettä). `surreal` on KUOLLUT feature
      # (mikään ei rakenna SurrealHearthStorea); sen korjaus koskee perheen
      # muistisubstraattia ja vaatii erillisen päätöksen. Listataan sen sijaan
      # kaikki ELÄVÄT ei-default-featuret eksplisiittisesti.
      - name: cargo test (kaikki elävät featuret)
        run: |
          cargo test --workspace \
            --features familyclaw-channels/discord \
            --features familyclaw-channels/telegram \
            --features familyclaw-channels/whatsapp \
            --features familyclaw-channels/signal \
            --features familyclaw-sandbox/wasmtime

  windows:
    name: Build and Test (Windows)
    needs: layer-b-audit
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build workspace (discord feature)
        run: cargo build --workspace --features discord

      - name: Run unit tests (discord feature)
        run: cargo test --workspace --features discord

  cargo-audit:
    name: cargo audit
    needs: layer-b-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        # cargo-audit EI lue deny.tomlia → ignoret toistettava tässä.
        # Pidä synkassa deny.toml:n [advisories].ignore-listan kanssa.
        # Perustelut: rsa Marvin (ei korjausta), rustls-webpki (discord-ketju,
        # ei korjaavaa serenity-versiota), atomic-polyfill+number_prefix
        # (unmaintained, ei haavoittuvuus). wasmtime-advisoryt korjattu 35→45.
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0049 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2023-0089 \
            --ignore RUSTSEC-2025-0119

  cargo-deny:
    name: cargo deny
    needs: layer-b-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo deny check
        run: cargo deny check
