# FamilyClaw gateway — single-tenant appliance compose
#
# Auth is MANDATORY: this compose binds 0.0.0.0 inside the container network
# namespace, so FAMILYCLAW_GATEWAY_TOKEN must be set (gateway fail-closed).
#
# Usage:
#   export FAMILYCLAW_GATEWAY_TOKEN="$(openssl rand -hex 32)"
#   docker compose up --build
#   curl -fsS -H "Authorization: Bearer $FAMILYCLAW_GATEWAY_TOKEN" \
#     http://127.0.0.1:8787/approvals/pending

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    environment:
      FAMILYCLAW_GATEWAY_ADDR: "0.0.0.0:8787"
      FAMILYCLAW_GATEWAY_TOKEN: "${FAMILYCLAW_GATEWAY_TOKEN:?set FAMILYCLAW_GATEWAY_TOKEN}"
      FAMILYCLAW_CHANNEL_KIND: "${FAMILYCLAW_CHANNEL_KIND:-none}"
      FAMILYCLAW_DATA_DIR: /data
      FAMILYCLAW_PROFILE_DIR: /profile
    volumes:
      - familyclaw-data:/data
      - ${FAMILYCLAW_PROFILE_HOST:-./.compose-profile}:/profile:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  familyclaw-data:
