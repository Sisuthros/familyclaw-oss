# Minimal cargo-deny policy for FamilyClaw (Layer A / OSS).
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# Perustellut poikkeukset (kukin: ei korjaavaa upstream-versiota TAI ei
# FamilyClawn laukaisemaa koodipolkua). Bumpattavat advisoryt EI kuulu tänne —
# ne korjataan (wasmtime 35→45 poisti 16 advisorya 2026-06-14; 2026-08-29
# ammonia 4.1.3→4.1.4, h2 0.4.14→0.4.19 ja wasmtime 45→46 poistivat kolme
# lisää). Jos vaimennus ei enää osu mihinkään, cargo-deny varoittaa
# `advisory-not-detected` — poista se silloin, älä jätä roikkumaan.
ignore = [
    # rsa Marvin Attack — RSA-PKCS1v15-purun ajoituskanava. Ei korjaavaa
    # upstream-versiota (transitiivinen jsonwebtoken-ketjusta). FamilyClaw ei
    # tee RSA-PKCS1v15-purkua; JWT-polku käyttää ed25519/ES256.
    "RUSTSEC-2023-0071",
    # rustls-webpki — CRL/name-constraint-validoinnin viat PALVELIN-
    # sertifikaateille. Tulevat vain `discord`-featuren transitiivisesta
    # ketjusta serenity 0.12.5 → tokio-tungstenite 0.21 → rustls 0.22; ei
    # korjaavaa serenity-versiota saatavilla. FamilyClaw on Discord-CLIENT,
    # ei validoi näillä poluilla. Poistuu kun serenity päivittää rustlsin.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
]
# HUOM: RUSTSEC-2026-0235 (rkyv 0.7.46) ei ole tässä listassa tarkoituksella.
# cargo-deny tarkastelee oletusfeature-graafia, jossa rkyv:tä ei ole lainkaan —
# se tulee valinnaisen `surreal`-featuren takaa. Vaimennus täällä tuottaisi
# `advisory-not-detected`-varoituksen. Perustelu ja vaimennus ovat
# `.cargo/audit.toml`:ssa, jonka työkalu näkee koko Cargo.lockin.

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    # webpki-roots ships the Mozilla CA bundle under CDLA-Permissive-2.0
    # (a permissive Community Data License for the certificate data set).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
