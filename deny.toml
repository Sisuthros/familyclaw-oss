# Minimal cargo-deny policy for FamilyClaw (Layer A / OSS).
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# Perustellut poikkeukset (kukin: ei korjaavaa upstream-versiota TAI ei
# FamilyClawn laukaisemaa koodipolkua). Bumpattavat advisoryt EI kuulu tänne —
# ne korjattiin (esim. wasmtime 35→45 poisti 16 advisorya 2026-06-14).
ignore = [
    # rsa Marvin Attack — RSA-PKCS1v15-purun ajoituskanava. Ei korjaavaa
    # upstream-versiota (transitiivinen jsonwebtoken-ketjusta). FamilyClaw ei
    # tee RSA-PKCS1v15-purkua; JWT-polku käyttää ed25519/ES256.
    "RUSTSEC-2023-0071",
    # rustls-webpki — CRL/name-constraint-validoinnin viat PALVELIN-
    # sertifikaateille. Tulevat vain `discord`-featuren transitiivisesta
    # ketjusta serenity 0.12.5 → tokio-tungstenite 0.21 → rustls 0.22; ei
    # korjaavaa serenity-versiota saatavilla. FamilyClaw on Discord-CLIENT,
    # ei validoi näillä poluilla. Poistuu kun serenity päivittää rustlsin.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # atomic-polyfill — unmaintained (ei haavoittuvuus). Transitiivinen.
    "RUSTSEC-2023-0089",
    # number_prefix — unmaintained (ei haavoittuvuus). Transitiivinen
    # (indicatif-ketju). Pieni, vakaa muotoilukirjasto.
    "RUSTSEC-2025-0119",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]
confidence-threshold = 0.8
