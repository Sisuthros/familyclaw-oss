# cargo-audit-politiikka FamilyClawlle (Layer A / OSS).
# TÄMÄ ON AINOA LÄHDE cargo-auditin vaimennuksille. CI ajaa pelkän
# `cargo audit` -komennon ilman --ignore-lippuja; työkalu lukee tämän tiedoston
# repon juuresta. Älä toista listaa workflow'ssa — kolmoiskirjanpito ajautui
# erilleen kerran jo (2026-08-29: kaksi vaimennusta ei osunut mihinkään).
#
# deny.toml pitää oman, PIENEMMÄN listansa: cargo-deny näkee vain
# oletusfeature-graafin, joten feature-gatatut cratet (esim. rkyv) kuuluvat
# vain tänne. Kukin poikkeus: ei korjaavaa upstream-versiota TAI ei FamilyClawn
# laukaisemaa koodipolkua. Bumpattavat advisoryt EIVÄT kuulu tänne.
# https://docs.rs/cargo-audit/latest/cargo_audit/config/

[advisories]
ignore = [
    # rsa Marvin Attack — RSA-PKCS1v15-purun ajoituskanava. Ei korjaavaa
    # upstream-versiota. FamilyClaw ei tee RSA-PKCS1v15-purkua (JWT = ed25519/ES256).
    "RUSTSEC-2023-0071",
    # rustls-webpki — CRL/name-constraint-viat PALVELIN-serteille. Tulevat vain
    # `discord`-featuren ketjusta serenity 0.12.5 → tokio-tungstenite 0.21 →
    # rustls 0.22; ei korjaavaa serenity-versiota. FamilyClaw on Discord-CLIENT,
    # ei validoi näillä poluilla. Poistuu kun serenity päivittää rustlsin.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # rkyv 0.7.46 — arkiston puutteellinen validointi voi aiheuttaa rajan yli
    # lukemisen Rc/Arc-arkistoissa (RUSTSEC-2026-0235). Korjaus vaatii
    # rkyv >=0.8.17, mutta rkyv tulee ketjusta surrealdb 3 → surrealdb-core →
    # rust_decimal, joka pinnaa yhä rkyv 0.7:n — korjaavaa upstream-versiota ei
    # ole. Koodipolku on lisäksi valinnaisen `surreal`-featuren takana
    # (familyclaw-hearth: `surrealdb = { optional = true }`), joka on oletuksena
    # POIS; `cargo deny` ei näe rkyv:tä graafissaan lainkaan. FamilyClaw ei pura
    # ulkopuolelta tulevia rkyv-arkistoja. Poistuu kun rust_decimal siirtyy
    # rkyv 0.8:aan.
    "RUSTSEC-2026-0235",
]
