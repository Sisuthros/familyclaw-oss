[workspace]
members = ["crates/*", "examples/minimal-gateway"]
# NOTE: "compiler" (the experimental Claw language) is intentionally excluded from the
# workspace build until it compiles cleanly. It is a future side-project, not part of the
# agent runtime, and must not block the core build. Re-add once parser.rs is complete.
# NOTE: "crates/familyclaw-gemu" is intentionally excluded per MASTERPLAN §7 — it is not
# a public/shipped component. Kept on disk (untracked), not part of the public workspace.
exclude = ["compiler", "crates/familyclaw-gemu/"]
resolver = "2"

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "MIT"
authors = ["The FamilyClaw contributors"]
repository = "https://github.com/Sisuthros/familyclaw"
rust-version = "1.88"


[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
croner = "3"
familyclaw-actions = { path = "crates/familyclaw-actions" }
familyclaw-agent = { path = "crates/familyclaw-agent" }
familyclaw-bench = { path = "crates/familyclaw-bench" }
familyclaw-bridge = { path = "crates/familyclaw-bridge" }
familyclaw-bus = { path = "crates/familyclaw-bus" }
familyclaw-channels = { path = "crates/familyclaw-channels" }
familyclaw-core = { path = "crates/familyclaw-core" }
familyclaw-dream = { path = "crates/familyclaw-dream" }
familyclaw-durable = { path = "crates/familyclaw-durable" }
familyclaw-embeddings = { path = "crates/familyclaw-embeddings" }
familyclaw-emotion = { path = "crates/familyclaw-emotion" }
familyclaw-growth = { path = "crates/familyclaw-growth" }
familyclaw-hearth = { path = "crates/familyclaw-hearth" }
familyclaw-latent = { path = "crates/familyclaw-latent" }
familyclaw-memory = { path = "crates/familyclaw-memory" }
familyclaw-mcp = { path = "crates/familyclaw-mcp" }
familyclaw-observability = { path = "crates/familyclaw-observability" }
familyclaw-runtime = { path = "crates/familyclaw-runtime" }
familyclaw-sandbox = { path = "crates/familyclaw-sandbox" }
familyclaw-scheduler = { path = "crates/familyclaw-scheduler" }
familyclaw-security = { path = "crates/familyclaw-security" }
ractor = "0.14"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
wasmtime = { version = "45", default-features = false, features = ["cranelift", "runtime"] }
wat = "1"
