[package]
name = "minimal-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Minimal FamilyClaw gateway — boots 2 agents + bus in 30s"
license = "MIT"
repository = "https://github.com/Sisuthros/familyclaw"

[[bin]]
name = "minimal-gateway"
path = "src/main.rs"

[dependencies]
familyclaw-agent = { path = "../../crates/familyclaw-agent" }
familyclaw-bus = { path = "../../crates/familyclaw-bus" }
familyclaw-channels = { path = "../../crates/familyclaw-channels" }
familyclaw-core = { path = "../../crates/familyclaw-core" }
familyclaw-runtime = { path = "../../crates/familyclaw-runtime" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }
uuid = { workspace = true }